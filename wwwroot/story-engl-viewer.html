<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skies Beyond the Star — Story (English)</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Georgia', serif;
            background: #0a0e1a;
            color: #d4d8e8;
            line-height: 1.8;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(15, 20, 40, 0.85);
            border: 1px solid rgba(100, 140, 220, 0.15);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1, h2, h3, h4, h5, h6 {
            color: #7eb8f0;
            margin: 1.5em 0 0.5em;
            line-height: 1.3;
        }
        h1 { font-size: 1.8rem; border-bottom: 1px solid rgba(100,140,220,0.2); padding-bottom: 0.5em; }
        h2 { font-size: 1.5rem; border-bottom: 1px solid rgba(100,140,220,0.1); padding-bottom: 0.3em; }
        h3 { font-size: 1.25rem; }
        p { margin: 0.8em 0; }
        a { color: #6ab0f3; }
        code {
            background: rgba(100,140,220,0.1);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
        }
        pre {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(100,140,220,0.1);
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1em 0;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        pre code { background: none; padding: 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid rgba(100,140,220,0.15);
            padding: 0.5em 0.8em;
            text-align: left;
        }
        th { background: rgba(100,140,220,0.08); color: #7eb8f0; }
        blockquote {
            border-left: 3px solid rgba(100,140,220,0.3);
            margin: 1em 0;
            padding: 0.5em 1em;
            color: #a0a8c0;
            background: rgba(100,140,220,0.04);
            border-radius: 0 8px 8px 0;
        }
        ul, ol { padding-left: 1.5em; margin: 0.8em 0; }
        li { margin: 0.3em 0; }
        hr { border: none; border-top: 1px solid rgba(100,140,220,0.15); margin: 2em 0; }
        strong { color: #b0c8f0; }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: #6ab0f3;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover { text-decoration: underline; }
        #loading { text-align: center; padding: 3rem; color: #6ab0f3; }
    </style>
    <meta http-equiv="refresh" content="0; url=/StoryStudio" />
    <link rel="canonical" href="/StoryStudio" />
</head>
<body>
    <div class="container">
        <a class="back-link" href="/">&#8592; Back to Portfolio</a>
        <div id="content">
            <p>The standalone story viewer has been retired. The book now lives in
            <a href="/StoryStudio">Story Studio</a> as an editable, structured tree.</p>
            <p>Redirecting…</p>
        </div>
    </div>
</body>
</html>
