name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/web-build/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install lossless image tools
        run: npm ci --prefix scripts/web-build --no-audit --no-fund
      - name: Verify imported source assets
        run: node scripts/verify-archeon-atlas.cjs
      - name: Build static pages and compressed assets
        env:
          SWA_QUOTA_MB: ${{ vars.SWA_QUOTA_MB }}
        run: node scripts/build-web.cjs
      - name: Verify published assets and page dependencies
        run: node scripts/verify-web.cjs
      - name: Check confirmed Azure quota and 90 percent budget
        run: node scripts/check-web-budget.cjs
      - name: Check deployment credential is configured
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_TREE_0DC0E5510 }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "The deployment secret is missing. Set it from the existing Azure Static Web App's deployment token."
            exit 1
          fi
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_TREE_0DC0E5510 }}
          action: upload
          app_location: dist-web
          api_location: ''
          skip_app_build: true
      - name: Retain exact size and integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-report
          path: docs/web-build-report.json
          if-no-files-found: ignore

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_TREE_0DC0E5510 }}
          action: close
